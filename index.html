<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Vocabulary &amp; Collocations Mastery Portal — 300 Units (A1–C2)</title>
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F6;
      color: #1E293B;
    }
    .font-serif-editorial {
      font-family: 'Newsreader', Georgia, serif;
    }
    .cover-mask {
      filter: blur(6px);
      background-color: #E2E8F0;
      color: transparent !important;
      user-select: none;
      border-radius: 6px;
      transition: filter 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }
    .cover-mask:hover {
      filter: blur(3px);
    }
    .cover-mask.revealed {
      filter: none;
      background-color: transparent;
      color: inherit !important;
      user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-toast {
      animation: fadeSlideUp 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-100 selection:text-indigo-900">
